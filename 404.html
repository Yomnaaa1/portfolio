<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Yomna Mohamed</title>
  <meta name="theme-color" content="#181C14">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Plus+Jakarta+Sans:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .error-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      position: relative;
      z-index: 2;
    }
    .error-card {
      max-width: 540px;
      padding: 3.5rem 2.5rem;
    }
    .error-code {
      font-family: var(--font-heading);
      font-size: clamp(4.5rem, 12vw, 7.5rem);
      font-weight: 900;
      line-height: 1;
      color: var(--text-highlight);
      margin-bottom: 1rem;
      letter-spacing: -0.04em;
    }
    .error-title {
      font-family: var(--font-heading);
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 1rem;
    }
    .error-desc {
      font-size: 1rem;
      color: var(--text-secondary);
      line-height: 1.65;
      margin-bottom: 2.25rem;
    }
  </style>
</head>
<body>
  <div class="ambient-orb orb-top-right" aria-hidden="true"></div>
  <div class="ambient-orb orb-bottom-left" aria-hidden="true"></div>
  <div class="grain-overlay" aria-hidden="true"></div>

  <div class="error-wrapper">
    <div class="bento-card error-card">
      <div class="error-code">404</div>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-desc">
        The digital experience or route you are looking for doesn't exist or has moved. Return to the main portfolio to explore full-stack and backend projects.
      </p>
      <a href="index.html" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>Back to Homepage</span>
      </a>
    </div>
  </div>
</body>
</html>
