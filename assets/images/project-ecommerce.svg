<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181C14"/>
      <stop offset="100%" stop-color="#242B1E"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ECDFCC"/>
      <stop offset="100%" stop-color="#697565"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid lines -->
  <g stroke="#ECDFCC" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/>
    <line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/>
    <line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Main Window Frame (IDE / Dashboard Mockup) -->
  <rect x="80" y="60" width="1040" height="555" rx="16" fill="#1E2319" stroke="#ECDFCC" stroke-opacity="0.2" filter="url(#cardShadow)"/>

  <!-- Window Header -->
  <rect x="80" y="60" width="1040" height="50" rx="16" fill="#141810"/>
  <rect x="80" y="94" width="1040" height="16" fill="#141810"/>
  <circle cx="112" cy="85" r="7" fill="#FF5F56"/>
  <circle cx="134" cy="85" r="7" fill="#FFBD2E"/>
  <circle cx="156" cy="85" r="7" fill="#27C93F"/>
  <text x="600" y="90" fill="#ECDFCC" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" text-anchor="middle">api.ecommerce.yomna.dev — Scalable Order &amp; Catalog Engine</text>
  <rect x="1000" y="74" width="90" height="24" rx="12" fill="#2E3725" stroke="#ECDFCC" stroke-opacity="0.3"/>
  <text x="1045" y="90" fill="#4ADE80" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">HTTP 200 OK</text>

  <!-- Left Sidebar (API Routes) -->
  <rect x="80" y="110" width="280" height="505" fill="#181D13" stroke="#ECDFCC" stroke-opacity="0.08"/>
  <text x="110" y="145" fill="#8E8D8A" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">RESTful ROUTE ENDPOINTS</text>

  <g transform="translate(105, 165)">
    <!-- Route 1 -->
    <rect x="0" y="0" width="230" height="42" rx="8" fill="#262F1F" stroke="#ECDFCC" stroke-opacity="0.2"/>
    <text x="15" y="26" fill="#4ADE80" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">POST</text>
    <text x="65" y="26" fill="#ECDFCC" font-family="'JetBrains Mono', monospace" font-size="12">/api/v1/auth/login</text>

    <!-- Route 2 -->
    <rect x="0" y="52" width="230" height="42" rx="8" fill="#1E2418"/>
    <text x="15" y="78" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">GET</text>
    <text x="65" y="78" fill="#C7BBAE" font-family="'JetBrains Mono', monospace" font-size="12">/api/v1/products</text>

    <!-- Route 3 -->
    <rect x="0" y="104" width="230" height="42" rx="8" fill="#1E2418"/>
    <text x="15" y="130" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">PUT</text>
    <text x="65" y="130" fill="#C7BBAE" font-family="'JetBrains Mono', monospace" font-size="12">/api/v1/cart/items</text>

    <!-- Route 4 -->
    <rect x="0" y="156" width="230" height="42" rx="8" fill="#1E2418"/>
    <text x="15" y="182" fill="#4ADE80" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">POST</text>
    <text x="65" y="182" fill="#C7BBAE" font-family="'JetBrains Mono', monospace" font-size="12">/api/v1/orders/checkout</text>

    <!-- Route 5 -->
    <rect x="0" y="208" width="230" height="42" rx="8" fill="#1E2418"/>
    <text x="15" y="234" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">GET</text>
    <text x="65" y="234" fill="#C7BBAE" font-family="'JetBrains Mono', monospace" font-size="12">/api/v1/analytics/kpi</text>
  </g>

  <!-- Right Code & Dashboard Panel -->
  <g transform="translate(390, 140)">
    <!-- Project Title Badge -->
    <text x="0" y="25" fill="#ECDFCC" font-family="'Outfit', sans-serif" font-size="28" font-weight="800">Scalable E-Commerce &amp; Order API</text>
    <text x="0" y="55" fill="#C7BBAE" font-family="'Plus Jakarta Sans', sans-serif" font-size="14">Engineered by Yomna Mohamed | Node.js, Express, MongoDB, Angular</text>

    <!-- Metrics Cards Row -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="220" height="85" rx="12" fill="#222A1C" stroke="#ECDFCC" stroke-opacity="0.15"/>
      <text x="20" y="32" fill="#8E8D8A" font-family="'JetBrains Mono', monospace" font-size="11">DATABASE LATENCY</text>
      <text x="20" y="65" fill="#4ADE80" font-family="'Outfit', sans-serif" font-size="26" font-weight="800">14ms</text>
      <text x="85" y="65" fill="#8E8D8A" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">(MongoDB Cluster)</text>

      <rect x="240" y="0" width="220" height="85" rx="12" fill="#222A1C" stroke="#ECDFCC" stroke-opacity="0.15"/>
      <text x="260" y="32" fill="#8E8D8A" font-family="'JetBrains Mono', monospace" font-size="11">JWT AUTH LAYER</text>
      <text x="260" y="65" fill="#ECDFCC" font-family="'Outfit', sans-serif" font-size="26" font-weight="800">Bcrypt</text>
      <text x="360" y="65" fill="#8E8D8A" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">(Role RBAC)</text>

      <rect x="480" y="0" width="220" height="85" rx="12" fill="#222A1C" stroke="#ECDFCC" stroke-opacity="0.15"/>
      <text x="500" y="32" fill="#8E8D8A" font-family="'JetBrains Mono', monospace" font-size="11">CLIENT FRONTEND</text>
      <text x="500" y="65" fill="#60A5FA" font-family="'Outfit', sans-serif" font-size="26" font-weight="800">Angular</text>
      <text x="610" y="65" fill="#8E8D8A" font-family="'Plus Jakarta Sans', sans-serif" font-size="12">(RxJS SPA)</text>
    </g>

    <!-- Code Preview Snippet Box -->
    <g transform="translate(0, 190)">
      <rect x="0" y="0" width="700" height="205" rx="12" fill="#131610" stroke="#ECDFCC" stroke-opacity="0.12"/>
      
      <text x="25" y="35" fill="#697565" font-family="'JetBrains Mono', monospace" font-size="13">// controllers/orderController.js - Yomna Mohamed</text>
      <text x="25" y="65" fill="#F472B6" font-family="'JetBrains Mono', monospace" font-size="13">export const <tspan fill="#60A5FA">processOrder</tspan> = <tspan fill="#FBBF24">async</tspan> (req, res, next) =&gt; {</text>
      <text x="50" y="95" fill="#ECDFCC" font-family="'JetBrains Mono', monospace" font-size="13">const session = await mongoose.startSession();</text>
      <text x="50" y="125" fill="#ECDFCC" font-family="'JetBrains Mono', monospace" font-size="13">session.startTransaction();</text>
      <text x="50" y="155" fill="#ECDFCC" font-family="'JetBrains Mono', monospace" font-size="13">const order = await Order.create([{ ...req.body }], { session });</text>
      <text x="50" y="185" fill="#4ADE80" font-family="'JetBrains Mono', monospace" font-size="13">return res.status(201).json({ status: "success", data: order });</text>
    </g>
  </g>
</svg>
